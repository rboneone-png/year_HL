:root {

* { box-sizing: border-box; }
body {

button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
header.top h1 { font-size: 24px; letter-spacing: .04em; }
header.top .sub { color: var(--muted); font-size: 12px; letter-spacing: .06em; }

.controls { display: flex; flex-direction: column; gap: 10px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface2); border: 1px solid var(--line); border-radius: var(--radius); padding: 3px; gap: 3px; }

.sectors { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.sectors::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; display: flex; gap: 6px; align-items: center; }
.chip i { width: 8px; height: 8px; border-radius: 50%; display: block; background: var(--c); }
.chip[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); font-weight: 700; }
.nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.nav button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 18px; line-height: 1; }

.nav .label { text-align: center; flex: 1; min-width: 0; }
.nav .label b { font-family: var(--font-display); font-size: 19px; display: block; }
.nav .label span { font-size: 12px; color: var(--muted); }
.nav .today { font-size: 12px; width: auto; padding: 0 12px; border-radius: 999px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; min-width: 0; }

.sectionhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }

.mcell b { font-family: var(--font-display); font-size: 16px; }

.mcell small { color: var(--muted); font-size: 12px; }
.mcell[aria-current="true"] { box-shadow: 0 0 0 2px var(--accent); }

/* month */
.dow, .grid7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.dow span { text-align: center; font-size: 12px; color: var(--muted); padding-bottom: 4px; }
.dcell { position: relative; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 2px 6px; display: flex; flex-direction: column; align-items: center; gap: 1px; min-height: 66px; border-bottom: 3px solid var(--wc); }

.dcell .ico { width: 22px; height: 22px; color: var(--wc); }

.jie { font-size: 10px; color: var(--accent); line-height: 1.1; }

.wlist { display: flex; flex-direction: column; gap: 6px; }
.wrow { display: grid; grid-template-columns: 56px 30px 1fr 56px; gap: 10px; align-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 8px 10px; text-align: left; width: 100%; }

.wrow .dd b { display: block; font-size: 14px; }
.wrow .dd span { font-size: 12px; color: var(--muted); }
.wrow .ico { width: 28px; height: 28px; color: var(--wc); }
.bar { height: 8px; border-radius: 4px; background: var(--surface2); position: relative; overflow: hidden; border: 1px solid var(--line); }
.bar::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--line); }
.bar i { position: absolute; top: 0; bottom: 0; background: var(--wc); }
.wrow .lv { font-size: 12px; text-align: right; color: var(--wc); font-weight: 700; }
.wrow .gzt { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* detail */
.pillars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
.pillar { text-align: center; border: 1px solid var(--line); border-radius: 8px; padding: 8px 4px; background: var(--surface2); }
.pillar small { display: block; font-size: 11px; color: var(--muted); }
.pillar .gz { font-family: var(--font-display); font-size: 22px; line-height: 1.2; }
.pillar .gz span { display: inline-block; }
.el-wood { color: var(--wood); } .el-fire { color: var(--fire); } .el-earth { color: var(--earth); } .el-metal { color: var(--metal); } .el-water { color: var(--water); }
.detail-grid { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: start; }
.luo { display: grid; grid-template-columns: repeat(3, 30px); grid-template-rows: repeat(3, 30px); gap: 2px; }
.luo span { display: grid; place-items: center; font-size: 13px; border-radius: 5px; background: var(--surface2); color: var(--muted); border: 1px solid var(--line); }
.luo span.hit { background: var(--c); color: var(--accent-ink); border-color: var(--c); font-weight: 700; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend svg { width: 16px; height: 16px; }
.note { font-size: 12px; color: var(--muted); }
@media (max-width: 420px) {
  .detail-grid { grid-template-columns: 1fr; }
  .wrow { grid-template-columns: 50px 28px 1fr 48px; gap: 8px; }
}
@media (prefers-reduced-motion: no-preference) {
  .card, .dcell, .wrow, .mcell { transition: box-shadow .15s; }
}
</style>

</div>

    [p.y, p.m, p.d].forEach(function (pl) { if (GAN_EL[pl[0]] === s) same++; if (ZHI_EL[pl[1]] === s) same++; });
    if (same >= 4) { sc -= 0.3; tags.push("五行過旺，防過熱"); }
    return { p: p, score: sc, lv: level(sc), tags: tags, y: y, m: m, d: d, dow: new Date(Date.UTC(y, m - 1, d)).getUTCDay() };
  }
  function level(s) { return s >= 0.8 ? 0 : s >= 0.3 ? 1 : s >= -0.25 ? 2 : s >= -0.75 ? 3 : 4; }
  function avgDays(days) {
    var t = days.filter(function (x) { return x.dow > 0 && x.dow < 6; });
    if (!t.length) t = days;
    var sum = 0; t.forEach(function (x) { sum += x.score; });
    return sum / t.length;
  }
  function gzStr(pl) { return GAN[pl[0]] + ZHI[pl[1]]; }
  function pillarHTML(label, pl) {
    return '<div class="pillar"><small>' + label + '</small><div class="gz"><span class="el-' + EL_CLS[GAN_EL[pl[0]]] + '">' + GAN[pl[0]] + '</span><span class="el-' + EL_CLS[ZHI_EL[pl[1]]] + '">' + ZHI[pl[1]] + '</span></div></div>';
  }

  /* ---------- 圖示 ---------- */
  var SVGS = [
    '<circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></g>',
    '<circle cx="8.5" cy="8.5" r="3.2" fill="currentColor"/><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8.5 2v1.6M2 8.5h1.6M3.9 3.9l1.1 1.1M13.1 3.9L12 5"/></g><path d="M9 20h8.5a3.5 3.5 0 0 0 .4-6.97A5 5 0 0 0 8.4 14.4 2.9 2.9 0 0 0 9 20z" fill="currentColor" opacity=".85"/>',
    '<path d="M7 19h10.5a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.3 12.4 3.4 3.4 0 0 0 7 19z" fill="currentColor"/>',
    '<path d="M7 14h10.5a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.3 7.4 3.4 3.4 0 0 0 7 14z" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 17l-1 3M12 17l-1 3M16 17l-1 3"/></g>',
    '<path d="M7 13h10.5a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.3 6.4 3.4 3.4 0 0 0 7 13z" fill="currentColor"/><path d="M12.8 12.5 9.6 17.3h2.6l-1 4.2 4-5.6h-2.7z" fill="currentColor"/>'
  ];
  function ico(l, cls) { return '<svg class="ico ' + (cls || "") + '" viewBox="0 0 24 24" aria-hidden="true">' + SVGS[l] + '</svg>'; }

  /* ---------- 狀態 ---------- */
  var now = new Date();
  var todayKey = { y: now.getFullYear(), m: now.getMonth() + 1, d: now.getDate() };
  function clampDate(o) {
    if (o.y < MIN_Y) return { y: MIN_Y, m: 1, d: 1 };
    if (o.y > MAX_Y) return { y: MAX_Y, m: 12, d: 31 };
    return o;
  }
  var state = { view: "month", sector: "tech", sel: clampDate({ y: todayKey.y, m: todayKey.m, d: todayKey.d }) };
  try {
    var saved = JSON.parse(localStorage.getItem("hl-state") || "{}");
    if (saved.view) state.view = saved.view;
    if (saved.sector && SECTORS.some(function (s) { return s.id === saved.sector; })) state.sector = saved.sector;
  } catch (e) {}
  function save() { try { localStorage.setItem("hl-state", JSON.stringify({ view: state.view, sector: state.sector })); } catch (e) {} }
  function sector() { return SECTORS.filter(function (s) { return s.id === state.sector; })[0]; }
  function dim(y, m) { return new Date(y, m, 0).getDate(); }
  function monthDays(y, m) { var a = [], n = dim(y, m), sec = sector(); for (var d = 1; d <= n; d++) a.push(evalDay(y, m, d, sec)); return a; }
  function weekDays(o) {
    var base = new Date(o.y, o.m - 1, o.d); base.setDate(base.getDate() - base.getDay());
    var a = [], sec = sector();
    for (var i = 0; i < 7; i++) { var t = new Date(base); t.setDate(base.getDate() + i); a.push(evalDay(t.getFullYear(), t.getMonth() + 1, t.getDate(), sec)); }
    return a;
  }
  function inRange(y) { return y >= MIN_Y && y <= MAX_Y; }
  function $(id) { return document.getElementById(id); }
  function pad2(n) { return n < 10 ? "0" + n : "" + n; }
  function sameDay(a, b) { return a.y === b.y && a.m === b.m && a.d === b.d; }
  function style(l) { return ' style="--wc: var(' + LV_VAR[l] + ')"'; }

  /* ---------- 繪製 ---------- */
  function renderControls() {
    ["year", "month", "week"].forEach(function (v) { $("v-" + v).setAttribute("aria-pressed", state.view === v ? "true" : "false"); });
    $("sectors").innerHTML = SECTORS.map(function (s) {
      return '<button class="chip" data-sec="' + s.id + '" aria-pressed="' + (state.sector === s.id) + '" style="--c: var(' + EL_VAR[s.el] + ')"><i></i>' + s.name + '<span class="el-' + EL_CLS[s.el] + '">' + EL[s.el] + '</span></button>';
    }).join("");
    $("legend").innerHTML = LEVELS.map(function (l, i) { return '<span style="color: var(' + LV_VAR[i] + ')">' + ico(i) + '<span style="color: var(--ink)">' + l.k + '（' + l.sub + '）</span></span>'; }).join("");
  }

  function renderHero(title, sub, avg, extra) {
    var lv = level(avg), L = LEVELS[lv];
    var sec = sector();
    $("hero").style.setProperty("--wc", "var(" + LV_VAR[lv] + ")");
    $("hero").innerHTML = ico(lv) +
      '<div><h2><span class="ttl">' + title + '</span>' + L.k + '<small>' + L.sub + ' · 指數 <span class="num">' + (avg >= 0 ? "+" : "") + avg.toFixed(2) + '</span></small></h2>' +
      '<p>' + L.adv + '</p>' +
      '<div class="tags"><span class="tag">主題：' + sec.name + '（' + EL[sec.el] + '）</span>' + (sub ? '<span class="tag">' + sub + '</span>' : '') + (extra || "") + '</div></div>';
  }

  function viewYear() {
    var y = state.sel.y, sec = sector(), ms = [];
    for (var m = 1; m <= 12; m++) { var ds = monthDays(y, m); ms.push({ m: m, avg: avgDays(ds), days: ds }); }
    var all = []; ms.forEach(function (x) { all = all.concat(x.days); });
    var p = pillars(y, 7, 1);
    var yAvg = avgDays(all);
    $("navTitle").textContent = y + " 年";
    $("navSub").textContent = GAN[p.y[0]] + ZHI[p.y[1]] + "年（立春換年）";
    var best = ms.slice().sort(function (a, b) { return b.avg - a.avg; })[0], worst = ms.slice().sort(function (a, b) { return a.avg - b.avg; })[0];
    renderHero(y + " 年", "流年 " + gzStr(p.y) + "（" + EL[GAN_EL[p.y[0]]] + EL[ZHI_EL[p.y[1]]] + "）", yAvg,
      '<span class="tag">最強 ' + best.m + ' 月</span><span class="tag">最弱 ' + worst.m + ' 月</span>');
    // 長條圖：以 0 為中線
    var W = 360, H = 170, L = 26, R = 6, T = 14, B = 22, cw = (W - L - R) / 12, mid = T + (H - T - B) / 2, half = (H - T - B) / 2 - 4;
    var maxAbs = 1.2;
    var bars = ms.map(function (x, i) {
      var v = Math.max(-maxAbs, Math.min(maxAbs, x.avg)), h = Math.abs(v) / maxAbs * half, lv = level(x.avg);
      var bx = L + i * cw + cw * 0.18, bw = cw * 0.64, by = v >= 0 ? mid - h : mid;
      return '<rect x="' + bx.toFixed(1) + '" y="' + by.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(h, 1.5).toFixed(1) + '" rx="2" fill="var(' + LV_VAR[lv] + ')"/>' +
        '<text x="' + (L + i * cw + cw / 2).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + x.m + '</text>';
    }).join("");
    var grid = [-1, 0, 1].map(function (g) {
      var gy = mid - g / maxAbs * half;
      return '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + gy.toFixed(1) + '" y2="' + gy.toFixed(1) + '" stroke="var(--line)" stroke-width="' + (g === 0 ? 1.2 : 0.6) + '"/><text x="' + (L - 4) + '" y="' + (gy + 3.5).toFixed(1) + '" text-anchor="end">' + (g > 0 ? "+1" : g < 0 ? "−1" : "0") + '</text>';
    }).join("");
    var cells = ms.map(function (x) {
      var lv = level(x.avg), a = x.days[0].p, b = x.days[x.days.length - 1].p;
      var cur = (todayKey.y === y && todayKey.m === x.m) ? ' aria-current="true"' : "";
      var gzs = gzStr(a.m) === gzStr(b.m) ? gzStr(a.m) + "月" : gzStr(a.m) + "→" + gzStr(b.m) + "月";
      return '<button class="mcell" data-month="' + x.m + '"' + style(lv) + cur + '><b>' + x.m + ' 月</b>' + ico(lv) + '<small>' + LEVELS[lv].k + ' · ' + LEVELS[lv].sub + '</small></button>';
    }).join("");
    $("body").innerHTML =
      '<div class="card"><div class="sectionhead"><h3>' + y + ' 年逐月氣象</h3><span>月指數（工作日平均）</span></div><div class="chartwrap"><svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="十二個月的投資氣象指數長條圖">' + grid + bars + '</svg></div></div>' +
      '<div class="months">' + cells + '</div>';
    setDetail(state.sel);
  }

  function viewMonth() {
    var y = state.sel.y, m = state.sel.m, ds = monthDays(y, m), avg = avgDays(ds);
    $("navTitle").textContent = y + " 年 " + m + " 月";
    var a = ds[0].p, b = ds[ds.length - 1].p;
    var gz = gzStr(a.m) === gzStr(b.m) ? gzStr(a.m) + "月" : gzStr(a.m) + "月 → " + gzStr(b.m) + "月";
    $("navSub").textContent = "節氣月 " + gz;
    renderHero(y + " 年 " + m + " 月", "節氣月 " + gz, avg);
    var first = new Date(y, m - 1, 1).getDay(), cells = "";
    for (var i = 0; i < first; i++) cells += '<div class="dcell pad"></div>';
    ds.forEach(function (x) {
      var off = x.dow === 0 || x.dow === 6, jie = jieOn(x.y, x.m, x.d);
      var cls = "dcell" + (off ? " off" : "") + (sameDay(x, state.sel) ? " sel" : "") + (sameDay(x, todayKey) ? " today" : "");
      cells += '<button class="' + cls + '" data-day="' + x.d + '"' + style(x.lv) + ' aria-label="' + m + '月' + x.d + '日 ' + LEVELS[x.lv].k + '"><span class="d num">' + x.d + '</span>' + ico(x.lv) + '<span class="gz">' + gzStr(x.p.d) + '</span>' + (jie ? '<span class="jie">' + jie + '</span>' : "") + '</button>';
    });
    $("body").innerHTML = '<div class="card"><div class="sectionhead"><h3>逐日氣象</h3><span>灰底為週末休市</span></div><div class="dow">' + WD.map(function (w) { return "<span>" + w + "</span>"; }).join("") + '</div><div class="grid7">' + cells + '</div></div>';
    setDetail(state.sel);
  }

  function viewWeek() {
    var ds = weekDays(state.sel), avg = avgDays(ds);
    var f = ds[0], l = ds[6];
    $("navTitle").textContent = f.m + "/" + f.d + " – " + l.m + "/" + l.d;
    $("navSub").textContent = f.y + " 年 · 日 至 六";
    var work = ds.filter(function (x) { return x.dow > 0 && x.dow < 6; });
    var best = work.slice().sort(function (a, b) { return b.score - a.score; })[0], worst = work.slice().sort(function (a, b) { return a.score - b.score; })[0];
    renderHero("本週", f.m + "/" + f.d + "–" + l.m + "/" + l.d, avg, '<span class="tag">較佳 週' + WD[best.dow] + '</span><span class="tag">較弱 週' + WD[worst.dow] + '</span>');
    $("body").innerHTML = '<div class="card"><div class="sectionhead"><h3>逐日氣象</h3><span>條形：指數 −1.2 至 +1.2</span></div><div class="wlist">' + ds.map(function (x) {
      var off = x.dow === 0 || x.dow === 6;
      var v = Math.max(-1.2, Math.min(1.2, x.score)), w = Math.abs(v) / 1.2 * 50, left = v >= 0 ? 50 : 50 - w;
      var jie = jieOn(x.y, x.m, x.d);
      return '<button class="wrow' + (off ? " off" : "") + (sameDay(x, state.sel) ? " sel" : "") + '" data-date="' + x.y + '-' + x.m + '-' + x.d + '"' + style(x.lv) + '>' +
        '<div class="dd"><b class="num">' + x.m + '/' + x.d + '</b><span>週' + WD[x.dow] + (off ? " 休市" : "") + '</span></div>' + ico(x.lv) +
        '<div><div class="bar"><i style="left:' + left.toFixed(1) + '%;width:' + w.toFixed(1) + '%"></i></div><div class="gzt">日柱 ' + gzStr(x.p.d) + '（' + EL[GAN_EL[x.p.d[0]]] + EL[ZHI_EL[x.p.d[1]]] + '）' + (jie ? ' · ' + jie : '') + (x.tags.length ? ' · ' + x.tags[0] : '') + '</div></div>' +
        '<div class="lv">' + LEVELS[x.lv].sub + '</div></button>';
    }).join("") + '</div></div>';
    setDetail(state.sel);
  }

  function setDetail(o) {
    var x = evalDay(o.y, o.m, o.d, sector()), sec = sector(), p = x.p, jie = jieOn(o.y, o.m, o.d);
    var hit = {}; LUO.forEach(function (r) { r.forEach(function (n) { if (LUO_EL[n] === sec.el) hit[n] = 1; }); });
    var luo = LUO.map(function (r) { return r.map(function (n) { return '<span' + (hit[n] ? ' class="hit"' : "") + '>' + n + '</span>'; }).join(""); }).join("");
    var gEl = GAN_EL[p.d[0]], zEl = ZHI_EL[p.d[1]];
    var relTxt = function (e) { var r = rel(e, sec.el); return r === 2 ? "生助" : r === 1 ? "同氣" : r === -0.5 ? "洩氣" : r === -2 ? "剋制" : "耗財（我剋）"; };
    $("detail").style.borderLeft = "5px solid var(" + LV_VAR[x.lv] + ")";
    $("detail").innerHTML =
      '<div class="sectionhead"><h3>' + o.y + '/' + o.m + '/' + o.d + '（週' + WD[x.dow] + '）' + (x.dow === 0 || x.dow === 6 ? " 休市" : "") + '</h3><span style="color:var(' + LV_VAR[x.lv] + ');font-weight:700">' + LEVELS[x.lv].k + ' · ' + LEVELS[x.lv].sub + '</span></div>' +
      '<div class="pillars">' + pillarHTML(p.yy + " 年柱", p.y) + pillarHTML("月柱", p.m) + pillarHTML("日柱", p.d) + '</div>' +
      '<div class="detail-grid"><dl class="kv">' +
      '<dt>主題</dt><dd>' + sec.name + '（' + EL[sec.el] + '，河圖 ' + HETU[sec.el] + '）</dd>' +
      '<dt>日干 ' + GAN[p.d[0]] + '</dt><dd>' + EL[gEl] + ' · ' + relTxt(gEl) + '</dd>' +
      '<dt>日支 ' + ZHI[p.d[1]] + '</dt><dd>' + EL[zEl] + ' · ' + relTxt(zEl) + '</dd>' +
      '<dt>月令 ' + gzStr(p.m) + '</dt><dd>' + EL[GAN_EL[p.m[0]]] + EL[ZHI_EL[p.m[1]]] + ' · ' + relTxt(ZHI_EL[p.m[1]]) + '</dd>' +
      '<dt>指數</dt><dd class="num">' + (x.score >= 0 ? "+" : "") + x.score.toFixed(2) + (jie ? '（今日交 ' + jie + '）' : "") + '</dd>' +
      '<dt>關注</dt><dd>' + sec.ind + '</dd>' +
      (x.tags.length ? '<dt>提醒</dt><dd>' + x.tags.join("、") + '</dd>' : "") +
      '</dl><div><div class="luo" style="--c: var(' + EL_VAR[sec.el] + ')" role="img" aria-label="洛書九宮，標示' + EL[sec.el] + '宮">' + luo + '</div><div class="note" style="margin-top:4px;text-align:center">洛書 · ' + EL[sec.el] + '宮</div></div></div>';
  }

  function render() {
    renderControls();
    if (state.view === "year") viewYear(); else if (state.view === "week") viewWeek(); else viewMonth();
    var atMin = state.sel.y <= MIN_Y && (state.view === "year" || (state.view === "month" && state.sel.m === 1) || (state.view === "week" && weekDays(state.sel)[0].y < MIN_Y));
    $("prev").disabled = prevTarget() === null;
    $("next").disabled = nextTarget() === null;
  }
  function shifted(n) {
    var s = state.sel, t;
    if (state.view === "year") t = { y: s.y + n, m: s.m, d: Math.min(s.d, dim(s.y + n, s.m)) };
    else if (state.view === "month") { var dt = new Date(s.y, s.m - 1 + n, 1); t = { y: dt.getFullYear(), m: dt.getMonth() + 1, d: Math.min(s.d, dim(dt.getFullYear(), dt.getMonth() + 1)) }; }
    else { var w = new Date(s.y, s.m - 1, s.d + 7 * n); t = { y: w.getFullYear(), m: w.getMonth() + 1, d: w.getDate() }; }
    return (t.y < MIN_Y || t.y > MAX_Y) ? null : t;
  }
  function prevTarget() { return shifted(-1); }
  function nextTarget() { return shifted(1); }

  /* ---------- 事件 ---------- */
  document.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.dataset.view) { state.view = b.dataset.view; save(); render(); }
    else if (b.dataset.sec) { state.sector = b.dataset.sec; save(); render(); }
    else if (b.id === "prev") { var t = prevTarget(); if (t) { state.sel = t; render(); } }
    else if (b.id === "next") { var n = nextTarget(); if (n) { state.sel = n; render(); } }
    else if (b.id === "todayBtn") { state.sel = clampDate({ y: todayKey.y, m: todayKey.m, d: todayKey.d }); render(); }
    else if (b.dataset.month) { state.sel = { y: state.sel.y, m: +b.dataset.month, d: Math.min(state.sel.d, dim(state.sel.y, +b.dataset.month)) }; state.view = "month"; save(); render(); window.scrollTo(0, 0); }
    else if (b.dataset.day) { state.sel = { y: state.sel.y, m: state.sel.m, d: +b.dataset.day }; viewMonth(); }
    else if (b.dataset.date) { var q = b.dataset.date.split("-"); state.sel = { y: +q[0], m: +q[1], d: +q[2] }; viewWeek(); }
  });
  render();
  window.__hl = { pillars: pillars, evalDay: evalDay, level: level, sectors: SECTORS };
})();
</script>
