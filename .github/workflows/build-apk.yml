name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install
      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Fix signing key and version
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./scripts/patch-android.sh ${{ github.run_number }}
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: hl-invest-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk heluo-invest.apk
      - name: Publish to Release (main only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 河洛數理投資 APK（最新）
          body: 下載 heluo-invest.apk 後安裝（需允許安裝未知來源 App）。
          files: heluo-invest.apk
